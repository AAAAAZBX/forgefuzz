[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgefuzz"
version = "0.1.0"
description = "A small, extensible, feedback-driven fuzzing framework for graph-based programs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "ForgeFuzz contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forgefuzz = "forgefuzz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forgefuzz = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
